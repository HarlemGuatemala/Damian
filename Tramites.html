    <!-- Efecto de scroll del encabezado -->
    <script src="script.js"></script>

    <!-- Script Inteligente: Optimiza imágenes pesadas antes de enviar -->
    <!-- Script Inteligente Corregido: Optimiza imágenes y envía de forma nativa -->
    <script>
        const formularios = document.querySelectorAll('.formulario-tramite');

        formularios.forEach(form => {
            form.addEventListener('submit', async function(e) {
                // Si el formulario ya fue procesado y está listo, dejamos que se envíe normalmente
                if (form.dataset.listo === "true") {
                    return; 
                }

                e.preventDefault(); // Detenemos el envío inicial para poder comprimir las fotos

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.innerText;

                // Desactivamos el botón para evitar clics dobles
                submitBtn.disabled = true;
                submitBtn.innerText = "Procesando...";

                // Configuración para que las fotos queden ligeras pero súper nítidas (Full HD)
                const opcionesCompresion = {
                    maxSizeMB: 0.9,          // Baja el peso a menos de 1 MB por foto
                    maxWidthOrHeight: 1920, // Mantiene la resolución para leer textos con claridad
                    useWebWorker: true      
                };

                try {
                    // Buscamos todos los campos de tipo archivo dentro de este formulario
                    const camposArchivo = form.querySelectorAll('input[type="file"]');
                    
                    for (let campo of camposArchivo) {
                        if (campo.files.length > 0) {
                            const archivoOriginal = campo.files[0];

                            // Solo optimizamos si es una imagen (DPI, recibos, etc.)
                            if (archivoOriginal.type.startsWith('image/')) {
                                submitBtn.innerText = `Optimizando imágenes...`;
                                
                                try {
                                    const archivoComprimido = await imageCompression(archivoOriginal, opcionesCompresion);
                                    
                                    // Creamos el nuevo archivo optimizado manteniendo el nombre original
                                    const archivoListo = new File([archivoComprimido], archivoOriginal.name, { type: archivoComprimido.type });

                                    // Pasamos el archivo optimizado directamente al campo del formulario del cliente
                                    const dataTransfer = new DataTransfer();
                                    dataTransfer.items.add(archivoListo);
                                    campo.files = dataTransfer.files;

                                } catch (errCompression) {
                                    console.error("Error comprimiendo este archivo, se enviará el original:", errCompression);
                                }
                            }
                        }
                    }

                    submitBtn.innerText = "Enviando trámite...";

                    // Marcamos el formulario como listo y lo enviamos de forma nativa para que Web3Forms lo acepte
                    form.dataset.listo = "true";
                    form.submit();

                } catch (error) {
                    console.error("Error en el proceso:", error);
                    alert("Ocurrió un inconveniente al procesar tus datos.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalBtnText;
                }
            });
        });
    </script>
